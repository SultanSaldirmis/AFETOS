{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AFETOS{% endblock %} — Afet Yönetimi Karar Destek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <style>
        body { background-color: #f4f6f8; }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
        .kart-vurgu { border-left: 4px solid var(--bs-primary); }
        .skor-badge { font-size: .95rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard:ana_panel' %}">🆘 AFETOS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard:ana_panel' %}">Ana Panel</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'olaylar:harita' %}">Harita</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'ihbarlar:olustur' %}">İhbar Oluştur</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'ekipler:liste' %}">Ekipler</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard:yonetim_paneli' %}">Yönetim Paneli</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
