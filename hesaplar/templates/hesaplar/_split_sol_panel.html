<div style="flex:0 0 42%;min-height:100vh;background:var(--panel-2);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:var(--sp-6);position:relative;overflow:hidden;box-sizing:border-box">
    <div class="afetos-doku"></div>
    <div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);position:relative">
        <div style="display:flex;align-items:center;gap:12px">
            <div style="width:34px;height:34px;border:2.5px solid var(--crit);border-radius:5px;display:flex;align-items:center;justify-content:center">
                <div style="width:10px;height:10px;background:var(--crit);border-radius:50%"></div>
            </div>
            <div style="font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.14em">AFETOS</div>
        </div>
        <div style="font-size:var(--fs-body);color:var(--text-2)">Afet Koordinasyon Sistemi</div>
        <div style="font-size:15px;color:var(--text-3);margin-top:var(--sp-2)">Karar destek, saniyeler içinde.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--sp-3);position:relative">
        <div style="display:flex;align-items:center;gap:8px">
            <span class="canli-nokta" style="width:6px;height:6px;border-radius:50%;background:var(--live)"></span>
            <span style="font-family:var(--mono);font-size:var(--fs-xs);color:var(--live);letter-spacing:.1em">CANLI SİSTEM DURUMU</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:var(--sp-3)">
            <div style="display:flex;justify-content:space-between"><span style="font-size:var(--fs-sm);color:var(--text-2)">Toplam ihbar</span><span style="font-family:var(--mono);font-size:var(--fs-body);font-weight:600">{{ toplam_ihbar }}</span></div>
            <div style="display:flex;justify-content:space-between"><span style="font-size:var(--fs-sm);color:var(--text-2)">Aktif olay kümesi</span><span style="font-family:var(--mono);font-size:var(--fs-body);font-weight:600;color:var(--crit)">{{ aktif_kume }}</span></div>
            <div style="display:flex;justify-content:space-between"><span style="font-size:var(--fs-sm);color:var(--text-2)">Sahadaki ekip</span><span style="font-family:var(--mono);font-size:var(--fs-body);font-weight:600;color:var(--low)">{{ sahadaki_ekip }}</span></div>
        </div>
    </div>
</div>
